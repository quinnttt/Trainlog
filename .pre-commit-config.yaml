repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version
  rev: v0.9.7
  hooks:
    # Run the linter
    - id: ruff
      args: [ --fix ]
    # Run the formatter
    - id: ruff-format
      args: ["--exclude", "app.py"]
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.13.10
  hooks:
    - id: uv-lock